<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cville Transportation Quoter</title>
<style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:0 18px;background:#f5f5f5}main{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #ddd}label{display:block;margin-top:12px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;font:inherit}button{margin-top:18px;padding:11px 18px;background:#111;color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}.result{margin-top:22px;padding:16px;background:#f0f7ff;border-radius:8px}.error{color:#a00}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head>
<body><main><h1>Charlottesville Transportation Quoter</h1><p>Manual first version. Home base: 910 Anderson St., Charlottesville.</p>
<label>Customer request / notes<textarea id="notes" rows="4" placeholder="Paste an email or text here for reference"></textarea></label>
<div class="grid"><div><label>Pickup address<input id="pickup" placeholder="e.g. IAD"></label></div><div><label>Destination<input id="destination" placeholder="e.g. 4125 Cannon Brook Way, Charlottesville, VA"></label></div></div>
<div class="grid"><div><label>Vehicle<select id="vehicle"><option value="sedan">Sedan</option><option value="suv">SUV</option></select></label></div><div><label>City-proper base rate<input id="base_rate" type="number" step="0.01" value="0"></label></div></div>
<label>Departure time (optional, RFC 3339)<input id="depart_at" placeholder="2026-10-16T19:30:00-04:00"></label>
<button onclick="quote()">Calculate quote</button><div id="out"></div></main>
<script>async function quote(){const out=document.getElementById('out');out.textContent='Calculating...';const payload={pickup:pickup.value,destination:destination.value,vehicle:vehicle.value,base_rate:base_rate.value,depart_at:depart_at.value};try{const r=await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error);out.innerHTML=`<div class="result"><b>Base rate:</b> $${d.base_rate.toFixed(2)}<br><b>Hourly calculation:</b> $${d.hourly_price.toFixed(2)}<br><b>Mileage calculation:</b> $${d.mileage_price.toFixed(2)}<br><h2>Recommended: $${d.recommended_price.toFixed(2)} (${d.recommended_method})</h2><b>Full driver cycle:</b> ${d.full_cycle.miles} miles / ${d.full_cycle.minutes} minutes<br><b>One-way customer route:</b> ${d.one_way.miles} miles / ${d.one_way.minutes} minutes</div>`}catch(e){out.innerHTML=`<p class="error">${e.message}</p>`}}</script></body></html>
