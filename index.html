<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cville Transportation Quoter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font:16px system-ui;max-width:820px;margin:30px auto;padding:0 18px;background:#f5f5f5;color:#171717}
main{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #ddd}
label{display:block;margin-top:12px;font-weight:600}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;font:inherit;border:1px solid #bbb;border-radius:5px}
button{margin-top:18px;padding:11px 18px;background:#111;color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{margin-top:22px;padding:16px;background:#f0f7ff;border-radius:8px}
#map{height:380px;margin-top:12px;border-radius:8px;background:#e8edf0}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.rates label{margin-top:0}
.hint{font-size:.92rem;color:#444}
.base-reference{margin-top:18px;padding:14px;background:#fff9e6;border:1px solid #e4cd89;border-radius:8px;overflow-x:auto}
.base-reference h3{margin:0 0 8px}
.base-reference table{width:100%;border-collapse:collapse;font-size:.92rem}
.base-reference th,.base-reference td{padding:9px 7px;text-align:left;border-bottom:1px solid #e4cd89;vertical-align:top}
.base-reference .selected-vehicle{font-weight:700;background:#fff0bd}
.base-reference small{display:block;color:#555;margin-top:4px}
.error{color:#a00}
@media(max-width:650px){.grid,.rates{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Charlottesville Transportation Quoter</h1>
<p>Enter the trip details, then edit the hourly rate, one-way mileage rate, or quote. The last value you change recalculates the other two.</p>
<label>Customer request / notes<textarea id="notes" rows="4" placeholder="Paste an email or text here for reference"></textarea></label>
<div class="grid">
  <div><label for="pickup">Pickup address</label><input id="pickup" placeholder="e.g. IAD"></div>
  <div><label for="destination">Destination</label><input id="destination" placeholder="e.g. 4125 Cannon Brook Way, Charlottesville, VA"></div>
</div>
<div class="grid">
  <div><label for="vehicle">Vehicle</label><select id="vehicle"><option value="sedan">Sedan</option><option value="suv">SUV</option></select></div>
  <div><label for="pickup_time">Customer pickup time (optional)</label><input id="pickup_time" type="datetime-local"></div>
</div>
<button id="calculate_button" type="button" onclick="calculateTrip()">Calculate trip</button>
<div id="out" aria-live="polite"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let trip = null;
let map = null;
let mapLayers = [];
const money = value => Number(value).toFixed(2);

function formatDuration(minutes){
  const totalMinutes=Math.round(Number(minutes));
  const hours=Math.floor(totalMinutes/60);
  const remainingMinutes=totalMinutes%60;
  return `${hours} ${hours===1 ? 'hr' : 'hrs'} ${remainingMinutes} min`;
}

async function calculateTrip(){
  if(map){map.remove();map=null;mapLayers=[];}
  const out=document.getElementById('out');
  out.textContent='Calculating route...';
  const localTime=document.getElementById('pickup_time').value;
  const payload={
    pickup:document.getElementById('pickup').value,
    destination:document.getElementById('destination').value,
    vehicle:document.getElementById('vehicle').value,
    pickup_time:localTime ? new Date(localTime).toISOString() : ''
  };
  try{
    const response=await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error || 'Could not calculate route');
    trip=data;
    out.innerHTML=`<section class="result">
      <h2>Trip estimate</h2>
      <div id="map" aria-label="TomTom route map"></div>
      <div><b>Full driver cycle:</b> ${data.full_cycle.miles} miles / ${formatDuration(data.full_cycle.minutes)}</div>
      <div><b>Customer one-way route:</b> ${data.one_way.miles} miles / ${formatDuration(data.one_way.minutes)}</div>
      <section id="base_rate_references" class="base-reference" aria-label="Base rate references"></section>
      <p class="hint">Change any one of the three values below. The other two will update to match the same quote.</p>
      <div class="rates">
        <label for="hourly_rate">Hourly rate ($/driver hour)<input id="hourly_rate" type="number" min="0" step="0.01" value="${money(data.hourly_rate)}" oninput="syncValues('hourly_rate')"></label>
        <label for="mileage_rate">One-way mileage rate ($/customer mile)<input id="mileage_rate" type="number" min="0" step="0.01" value="${money(data.mileage_rate)}" oninput="syncValues('mileage_rate')"></label>
        <label for="final_quote">Final quote ($)<input id="final_quote" type="number" min="0" step="0.01" value="${money(data.quote)}" oninput="syncValues('quote')"><input id="quote_slider" aria-label="Adjust final quote" type="range" min="0" max="${Math.max(100, Math.ceil(data.quote * 2))}" step="0.01" value="${data.quote}" oninput="syncValues('quote_slider')"></label>
      </div>
    </section>`;
    renderBaseRateReferences(data.base_rate_reference);
    showMap(data);
  }catch(error){
    out.innerHTML='';
    const message=document.createElement('p');
    message.className='error';
    message.textContent=error.message;
    out.appendChild(message);
  }
}

function renderBaseRateReferences(reference){
  const panel=document.getElementById('base_rate_references');
  const add=(parent,tag,text)=>{
    const element=document.createElement(tag);
    element.textContent=text;
    parent.appendChild(element);
    return element;
  };
  add(panel,'h3','Base rates from your Excel file');
  if(!reference || reference.status!=='ok'){
    add(panel,'p','References unavailable. Check that Taxi Pricing.xlsx is in the app folder.');
    return;
  }
  const matches=reference.matches || [];
  const notes=reference.pickup_notes || [];
  if(!matches.length && !notes.length){
    add(panel,'p','No matching base-rate reference found for these addresses.');
    return;
  }
  add(panel,'p','Reference only. Confirm the listed route and choose the schedule that applies to this trip.');
  if(matches.length){
    const table=document.createElement('table');
    panel.appendChild(table);
    const header=document.createElement('tr');
    table.appendChild(header);
    ['Schedule','Listed route','Sedan','SUV'].forEach(label=>add(header,'th',label));
    matches.forEach(rate=>{
      const row=document.createElement('tr');
      table.appendChild(row);
      add(row,'td',rate.schedule);
      const route=add(row,'td',rate.route);
      add(route,'small',rate.match);
      if(rate.shared_rate!=null){
        const cell=add(row,'td',`$${money(rate.shared_rate)} (Sedan/SUV as listed)`);
        cell.colSpan=2;
      }else{
        ['sedan','suv'].forEach(vehicle=>{
          const cell=add(row,'td',rate[vehicle]==null ? 'Not listed' : `$${money(rate[vehicle])}`);
          if(vehicle===trip.vehicle) cell.className='selected-vehicle';
        });
      }
    });
  }
  notes.forEach(note=>{
    add(panel,'h4',`${note.heading} — ${note.base}`);
    const list=document.createElement('ul');
    panel.appendChild(list);
    note.items.forEach(item=>add(list,'li',item));
  });
  const source=add(panel,'p',`Source: ${reference.source}. Airport area matches should be confirmed.`);
  source.className='hint';
}

function showMap(data){
  if(!window.L) return;
  if(!map){
    map=L.map('map');
    L.tileLayer('/api/tiles/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© TomTom'}).addTo(map);
  }else{
    mapLayers.forEach(layer=>map.removeLayer(layer));
    mapLayers=[];
  }
  const full=data.full_cycle.points || [];
  const oneWay=data.one_way.points || [];
  if(full.length>1){
    const line=L.polyline(full,{color:'#e05252',weight:4,opacity:.65}).addTo(map);
    mapLayers.push(line);
  }
  if(oneWay.length>1){
    const line=L.polyline(oneWay,{color:'#1665d8',weight:5,opacity:.9}).addTo(map);
    mapLayers.push(line);
  }
  const stops=[
    {point:data.home_point,label:'Home base'},
    {point:data.pickup_point,label:`Pickup: ${data.pickup}`},
    {point:data.destination_point,label:`Destination: ${data.destination}`}
  ];
  stops.forEach(stop=>{
    const marker=L.marker(stop.point).bindPopup(document.createTextNode(stop.label)).addTo(map);
    mapLayers.push(marker);
  });
  const bounds=[...full,...stops.map(stop=>stop.point)];
  if(bounds.length) map.fitBounds(bounds,{padding:[24,24],maxZoom:13});
  else map.setView(data.home_point,11);
  window.setTimeout(()=>map.invalidateSize(),0);
}

function syncValues(source){
  if(!trip) return;
  const hours=Number(trip.full_cycle.minutes)/60;
  const miles=Number(trip.one_way.miles);
  const hourly=document.getElementById('hourly_rate');
  const mileage=document.getElementById('mileage_rate');
  const quote=document.getElementById('final_quote');
  const edited=source==='quote' ? quote : document.getElementById(source);
  if(edited.value.trim()==='') return;
  const value=Number(edited.value);
  if(!Number.isFinite(value)||value<0) return;
  let finalQuote;
  if(source==='hourly_rate') finalQuote=value*hours;
  else if(source==='mileage_rate') finalQuote=value*miles;
  else finalQuote=value;
  if(edited!==quote) quote.value=money(finalQuote);
  if(edited!==hourly) hourly.value=hours ? money(finalQuote/hours) : '0.00';
  if(edited!==mileage) mileage.value=miles ? money(finalQuote/miles) : '0.00';
  const slider=document.getElementById('quote_slider');
  if(finalQuote>Number(slider.max)) slider.max=Math.ceil(finalQuote*2);
  slider.value=finalQuote;
}
</script>
</body>
</html>
